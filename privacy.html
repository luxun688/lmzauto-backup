<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隐私政策 — lmzauto-backup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #243047; background: #f4f6f9; }
    body { margin: 0; padding: 64px 24px; }
    main { max-width: 680px; margin: 0 auto; padding: 40px; background: #fff; border: 1px solid #dce2eb; border-radius: 16px; }
    h1 { margin: 0 0 24px; font-size: clamp(1.6rem, 5vw, 2rem); line-height: 1.3; }
    p { margin: 0 0 20px; font-size: 1rem; line-height: 1.9; }
    a { color: #1858a8; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #1858a8; outline-offset: 5px; }
    nav { border-top: 1px solid #e5e9f0; padding-top: 24px; margin-top: 28px; }
    @media (max-width: 480px) { body { padding: 24px 16px; } main { padding: 28px 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>隐私政策</h1>
    <p>本工具仅供站长备份和恢复其管理的业务数据库，不对外提供服务。备份可能包含业务系统已有的客户订单等数据。</p>
    <p>本工具仅使用 drive.file 权限，访问本应用创建或经站长明确授权的文件，不访问其他未授权文件。</p>
    <p>备份在服务器加密后上传至站长本人的 Google 云端硬盘。加密密码由站长控制，保存在受保护的服务器配置中，站长另行保管副本；密码不随备份上传。</p>
    <p>如需联系，请在本仓库提交 <a href="https://github.com/luxun688/lmzauto-backup/issues">GitHub Issue</a>。</p>
    <nav aria-label="相关页面"><a href="./">lmzauto-backup</a></nav>
  </main>
</body>
</html>
